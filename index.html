<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/project-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK | UI UX & Web Designer</title>
    <meta name="description" content="Portfolio of SK - UI UX & Web Designer crafting bold, minimalist digital experiences by bridging the gap between creative visual design and clean technical execution." />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Hide Netlify Badge anywhere on site -->
    <style>
      html.nl-narrow {
        display: none;
      }

      .nl-badge,
      #nl-badge,
      #nl-card,
      .nl-drawer,
      .nl-narrow,
      [aria-label*="Powered by Netlify"],
      [aria-controls="nl-card"],
      iframe[src*="netlify"],
      iframe[title*="Netlify"],
      iframe[aria-label*="Netlify"],
      div[id*="netlify"],
      div[class*="netlify"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // Immediately remove Netlify badge iframe if injected
      (function() {
        function removeNetlifyBadge() {
          var selectors = 'iframe[src*="netlify"], iframe[title*="Netlify"], iframe[aria-label*="Netlify"], #nl-badge, .nl-badge, #nl-card, .nl-drawer, [aria-label*="Powered by Netlify"]';
          document.querySelectorAll(selectors).forEach(function(el) {
            el.remove();
          });
        }
        removeNetlifyBadge();
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(removeNetlifyBadge);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
