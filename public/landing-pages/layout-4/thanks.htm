.editnumber button:hover {opacity: 1;transition: all 0.2s ease-in-out;}
.editnumber .form {clear: both;}

.editnumber .form .box span{width: 100px;}
.editnumber .form--disabled input {padding-left: 0;padding-top: 4px;
border: 0 solid #efefef;background: white;height: auto;

<script src="js/jquery.min.js"></script>
<script>
var form_ele = document.querySelector('.form');

// Make everything disabled
var disableFormEdit = function(selector) {    
    selector.classList.remove('form--enabled');
    selector.classList.add('form--disabled');
    var elements = selector.querySelectorAll('input, select, button');
    elements.forEach(function(element) {
        element.disabled = true;
    });
}

// Make everything enabled
var enableFormEdit = function(selector) {    
    var elements = selector.querySelectorAll('input, select, button');
    elements.forEach(function(element) {
        element.disabled = false;
    });
    selector.classList.remove('form--disabled');
    selector.classList.add('form--enabled');
}

disableFormEdit(form_ele);

document.querySelector('.js-toggleForm').addEventListener('click', function() {
    // Get the status of the form
    var form_status = form_ele.classList.contains('form--disabled') ? 'disabled' : 'enabled';
    
    // Check if disabled or enabled
    switch (form_status) {
        case 'disabled':
            enableFormEdit(form_ele);
            this.textContent = 'Update';
            break;
        case 'enabled':
            disableFormEdit(form_ele);
            this.textContent = 'Edit';
            break;
    }
});
</script>
